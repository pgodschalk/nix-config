# yaml-language-server: $schema=https://www.schemastore.org/dependabot-2.0.json
---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # CodeQL fails when its steps run different versions, so they
      # move in one pull request.
      codeql-action:
        patterns:
          - github/codeql-action*
    labels:
      - ci
      - dependencies
