# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Greetings

# pull_request_target, because a fork's pull_request token is read-only
# and cannot comment. It runs with a write token in this repository's
# context, which is safe only while no step checks out the PR's code.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
  issues:
    types:
      - opened

permissions: {}

jobs:
  greeting:
    name: Greet First-Time Contributors
    runs-on: ubuntu-latest
    # first-interaction counts anyone without an issue as a newcomer to
    # pull requests, and the reverse, so bots and the owner are skipped.
    if: >-
      github.actor != 'dependabot[bot]'
      && github.actor != github.repository_owner
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          issue_message: |
            Thanks for opening your first issue here.

            This repository is my personal macOS configuration, so most
            of what it declares is preference rather than something that
            can be wrong for everyone. Reports about the packaging under
            `pkgs/`, a pinned version that has gone stale, or a module
            that does not do what its comments say are all welcome.

            The bug template asks for the two things that settle most of
            these: the exact command with its output, and whether it
            still happens from a clean login shell.
          pr_message: |
            Thanks for opening your first pull request here.

            This repository configures one machine, so changes to the
            settings it declares are my own preferences and are unlikely
            to be merged. Fixes to the packaging under `pkgs/`, to a
            module that misbehaves, or to a pin that has gone stale are
            welcome.

            Two things the checks look for: that the system still
            evaluates, and that the portable half of `modules/home`
            still evaluates for Linux. Commit messages follow
            Conventional Commits.
